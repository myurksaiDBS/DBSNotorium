crons:
  - name: commission-alerts
    description: "Daily 8am UTC scan for notary commissions nearing expiration; emails owner at 60/30/14/7/1-day marks and on expiry day"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/commission-alerts"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: delivery-bounces
    description: "Daily 8:30am UTC digest of certificate emails that bounced in the last 24h. Sends one email per notary listing failed sends with one-click resend links."
    cron: "30 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/delivery-bounces"
    method: POST
    enabled: true
  - name: intake-reminders
    description: "Every 4h scan for pending signer-intake links whose appointment is 20-32h away. Emails the signer a reminder to complete the intake before their notarization."
    cron: "0 */4 * * *"
    endpoint: "{{BASE_URL}}/api/cron/intake-reminders"
    method: POST
    enabled: true
